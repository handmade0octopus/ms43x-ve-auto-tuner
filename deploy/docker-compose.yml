services:
  ms43x:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ms43x-ve-auto-tuner:latest
    container_name: ms43x-ve-auto-tuner
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    # loopback only — Caddy on the host is the only intended client
    ports:
      - "127.0.0.1:3310:8000"
